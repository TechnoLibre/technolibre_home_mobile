apply plugin: 'com.android.application'

// Dev fast-iteration env vars (defaults preserve a full release-quality build):
//   BUNDLE_SKIP_WHISPER=1  → do not compile whisper.cpp / ggml. Saves ~5 min
//                            of NDK build the first time and ~300 MB in the
//                            APK. Transcription is no-op at runtime.
//   ALL_ABIS=1             → keep every ABI in the APK (arm64-v8a, armeabi-v7a,
//                            x86, x86_64). Needed when running an emulator or
//                            when you might switch devices. Defaults to
//                            arm64-v8a only — modern phones — which trims
//                            another ~50% off the native libs.
def skipWhisper = System.getenv("BUNDLE_SKIP_WHISPER") == "1"
def allAbis = System.getenv("ALL_ABIS") == "1"

android {
    namespace = "ca.erplibre.home"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "ca.erplibre.home"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2026082401
        versionName "2026.08.24.01"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "boolean", "SKIP_WHISPER", "${skipWhisper}"

        // `-PlanCleartext` produit un APK de DEMONSTRATION qui tolere le HTTP
        // en clair, pour joindre un Odoo du reseau local en Wi-Fi.
        //
        // Android n'accepte pas de plages CIDR dans sa configuration reseau :
        // on ne peut pas y ecrire « seulement les adresses privees ». Lever la
        // protection la leve donc entierement, et le seul rempart restant est
        // la verification cote application (plages RFC 1918 + accord explicite
        // de l'utilisateur). C'est plus faible, et c'est pourquoi ce n'est PAS
        // le defaut.
        def lanCleartext = project.hasProperty('lanCleartext')
        if (lanCleartext) {
            logger.warn("lanCleartext : APK de demonstration, HTTP en clair tolere par le systeme")
        }
        manifestPlaceholders = [
            netSecConfig    : lanCleartext ? "network_security_config_lan"
                                           : "network_security_config",
            cleartextAllowed: lanCleartext ? "true" : "false",
        ]
        if (!skipWhisper) {
            externalNativeBuild {
                cmake {
                    cppFlags "-std=c++17"
                    arguments "-DANDROID_STL=c++_shared"

                    // sentencepiece récupère protobuf, dont le CMake construit
                    // `protoc` pour la CIBLE puis tente de l'exécuter sur l'hôte
                    // afin de générer les .pb.cc. Comme la cible est arm64 et
                    // l'hôte x86_64, cela échoue sur « Exec format error ».
                    //
                    // sentencepiece prévoit le cas : SPM_PROTOC_EXECUTABLE
                    // désigne un protoc hôte et désactive celui de la cible. Le
                    // binaire est produit par tools/build-host-protoc.sh, dans
                    // la version que sentencepiece exige — code généré et
                    // bibliothèque d'exécution vont par paire.
                    //
                    // Rien à faire quand BUNDLE_SKIP_WHISPER=1 : la compilation
                    // native est alors sautée, sentencepiece avec.
                    def hostProtoc = rootProject.file("tools/protoc/bin/protoc")
                    if (hostProtoc.exists()) {
                        arguments "-DSPM_PROTOC_EXECUTABLE=${hostProtoc.absolutePath}"
                    } else {
                        logger.warn("protoc hôte absent : lancez android/tools/build-host-protoc.sh, " +
                                    "sinon la compilation native échouera sur « Exec format error ».")
                    }
                }
            }
        }
        if (!allAbis) {
            ndk {
                abiFilters "arm64-v8a"
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            //
            // `-PslimApk` retire les dépôts de code embarqués pour le navigateur
            // hors ligne. Ils pèsent à eux seuls 123 306 fichiers, alors qu'un
            // APK ne peut contenir que 65 535 entrées : sans cette option, la
            // tâche packageDebug échoue sur « Too many zip entries ».
            //
            // Ce n'est PAS un correctif : l'APK produit perd le navigateur de
            // code. Il sert à obtenir une application installable pour tester
            // le reste. La solution durable — réduire ce qui est embarqué, ou
            // le servir autrement — est une décision de produit.
            def slim = !project.hasProperty('slimApk') || project.property('slimApk').toString() != 'false'
            if (slim) {
                logger.lifecycle("slimApk : dépôts de code embarqués exclus de l'APK")
            } else {
                logger.warn("slimApk=false : l'empaquetage va échouer, 124 000 entrées pour 65 535 permises.")
            }
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~' +
                    (slim ? ':repos:repo' : '')
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    if (!skipWhisper) {
        externalNativeBuild {
            cmake {
                path "src/main/cpp/CMakeLists.txt"
                version = "3.22.1"
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "com.google.android.gms:play-services-cast-framework:21.2.0"
    implementation "com.github.mwiede:jsch:0.2.25"
    implementation "com.google.mlkit:text-recognition:16.0.1"
    // MarianMT on-device translation: ONNX Runtime for encoder/decoder inference
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.20.0"
    implementation "com.google.mlkit:face-detection:16.1.7"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
